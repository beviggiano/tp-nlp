[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmtc-propensity-robustness"
version = "0.1.0"
description = "Experimental toolkit for propensity-scored metrics in extreme multi-label text classification."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Bernardo Viggiano Campos" },
  { name = "Eduardo Henrique dos Santos Correia" },
  { name = "Rafael Cardoso Chimicatti" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
hnsw = ["hnswlib>=0.8.0"]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
